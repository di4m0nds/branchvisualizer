# Tag-driven release: push a `v*` tag and this builds native installers for
# Linux (AppImage / .deb / .rpm) and Windows 10/11 (NSIS setup .exe), attaching
# them to a draft GitHub release. macOS is deliberately not in the matrix yet.
#
# Binaries are UNSIGNED for now — Windows SmartScreen will warn on first run
# (documented in docs/SETUP.md). Add signing config here when certs exist.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: oldest supported glibc → AppImage runs on the widest
          # range of distros (Ubuntu 22.04+, Debian 12+, Fedora 38+).
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@9.15.4);
      # specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'di4m0nds Code Agent ${{ github.ref_name }}'
          releaseBody: 'See the assets below. Install guide: docs/SETUP.md'
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}
