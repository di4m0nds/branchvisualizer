name: CI

on:
  push:
    branches: [trunk, development]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@9.15.4);
      # specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Lint currently has pre-existing findings; surface them without blocking CI.
      - name: Lint (non-blocking)
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build

  rust:
    name: Rust (cargo test · check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

  # The only regression guard for the `cfg(windows)` code paths (shell
  # selection, cmd /C, USERPROFILE, .cmd shim spawning) — Linux builds never
  # compile them.
  rust-windows:
    name: Rust Windows (cargo test · check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
