[package]
name = "app"
version = "0.1.0"
description = "Multi-session, multi-provider AI code-agent IDE in a Tauri desktop shell"
authors = ["di4m0nds"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.8"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Pure-Rust agent grep: gitignore-aware walk + regex (no external `grep`).
ignore = "0.4"
regex = "1"
# System status bar / process inspector (CPU, memory, disks, processes).
sysinfo = "0.33"
